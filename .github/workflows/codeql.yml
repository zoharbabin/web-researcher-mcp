name: 🔍 CodeQL Security Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 06:00 UTC

permissions: {}

jobs:
  # ── 🔍 CodeQL ─────────────────────────────────────────────────────────────────
  # Runs GitHub's CodeQL engine with `security-extended,security-and-quality`
  # query suites. Results appear in Security → Code scanning. Findings must be
  # addressed or dismissed before they accumulate.
  analyze:
    name: 🔍 CodeQL · Go
    runs-on: ubuntu-latest
    permissions:
      actions: read          # codeql-action reads workflow run metadata
      contents: read          # checkout
      security-events: write  # upload SARIF results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.4"
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: go
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: "/language:go"
