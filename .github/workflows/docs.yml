name: 📚 Docs Deploy

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "ARCHITECTURE.md"
      - "CONTRIBUTING.md"
      - "docs/**"
      - "decks/**"
      - "overrides/**"
      - "landing/**"
      - "assets/logo-final-transparent.svg"
      - "assets/favicon.ico"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"

permissions: {}

jobs:
  deploy:
    name: 📚 Deploy Docs to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: write  # peaceiris/actions-gh-pages pushes to gh-pages branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.x"

      - name: Install mkdocs-material
        run: pip install mkdocs-material==9.6.14

      - name: Assemble docs from source files
        run: |
          mkdir -p site_src
          # Copy and rewrite internal links to flattened structure
          for f in README.md ARCHITECTURE.md CONTRIBUTING.md; do
            # Rewrites are anchored to the Markdown link prefix `](` so that
            # only clickable links are flattened to the site's URL scheme.
            # Inline code-span repo paths (e.g. `docs/SECURITY.md`) are left
            # verbatim — they document on-disk paths, not site routes.
            sed -e 's|](docs/TOOLS.md|](tools.md|g' \
                -e 's|](docs/ERROR_HANDLING.md|](error-handling.md|g' \
                -e 's|](docs/SECURITY_AND_COMPLIANCE.md|](security-and-compliance.md|g' \
                -e 's|](docs/SECURITY.md|](security.md|g' \
                -e 's|](docs/DEPLOYMENT.md|](deployment.md|g' \
                -e 's|](docs/MIGRATION.md|](migration.md|g' \
                -e 's|](docs/EXAMPLES.md|](examples.md|g' \
                -e 's|](docs/API_SETUP.md|](api-setup.md|g' \
                -e 's|](docs/PROVIDERS.md|](providers.md|g' \
                -e 's|](docs/LESSONS_LEARNED.md|](lessons-learned.md|g' \
                -e 's|](docs/BRAND_GUIDELINES.md|](brand-guidelines.md|g' \
                -e 's|](docs/DESIGN.md|](design.md|g' \
                -e 's|](docs/PRIVACY.md|](privacy.md|g' \
                -e 's|](docs/SESSION_PERSISTENCE.md|](session-persistence.md|g' \
                -e 's|](ARCHITECTURE.md|](architecture.md|g' \
                -e 's|](CONTRIBUTING.md|](contributing.md|g' \
                -e 's|](SECURITY.md)|](https://github.com/zoharbabin/web-researcher-mcp/blob/main/SECURITY.md)|g' \
                -e 's|](CODE_OF_CONDUCT.md|](https://github.com/zoharbabin/web-researcher-mcp/blob/main/CODE_OF_CONDUCT.md|g' \
                -e 's|](assets/|](https://raw.githubusercontent.com/zoharbabin/web-researcher-mcp/main/assets/|g' \
                -e 's|src="assets/|src="https://raw.githubusercontent.com/zoharbabin/web-researcher-mcp/main/assets/|g' \
                "$f" > "site_src/$(echo "$f" | tr '[:upper:]' '[:lower:]')"
          done
          mv site_src/readme.md site_src/index.md
          # Copy docs/ files with cross-link rewriting
          for f in docs/TOOLS.md docs/DEPLOYMENT.md docs/SECURITY.md docs/SECURITY_AND_COMPLIANCE.md docs/MIGRATION.md docs/EXAMPLES.md docs/API_SETUP.md docs/PROVIDERS.md docs/LESSONS_LEARNED.md docs/BRAND_GUIDELINES.md docs/DESIGN.md docs/PRIVACY.md docs/SESSION_PERSISTENCE.md docs/ERROR_HANDLING.md docs/CICD.md; do
            # Anchored to `](` for the same reason as the root loop above:
            # flatten only Markdown links, never inline code-span repo paths.
            # `](../SECURITY.md` and the root-policy link resolve to GitHub
            # because root SECURITY.md is not published to the site.
            sed -e 's|](ARCHITECTURE.md|](architecture.md|g' \
                -e 's|](CONTRIBUTING.md|](contributing.md|g' \
                -e 's|](ERROR_HANDLING.md|](error-handling.md|g' \
                -e 's|](SECURITY_AND_COMPLIANCE.md|](security-and-compliance.md|g' \
                -e 's|](../SECURITY.md)|](https://github.com/zoharbabin/web-researcher-mcp/blob/main/SECURITY.md)|g' \
                -e 's|](SECURITY.md|](security.md|g' \
                -e 's|](TOOLS.md|](tools.md|g' \
                -e 's|](DEPLOYMENT.md|](deployment.md|g' \
                -e 's|](MIGRATION.md|](migration.md|g' \
                -e 's|](EXAMPLES.md|](examples.md|g' \
                -e 's|](API_SETUP.md|](api-setup.md|g' \
                -e 's|](PROVIDERS.md|](providers.md|g' \
                -e 's|](LESSONS_LEARNED.md|](lessons-learned.md|g' \
                -e 's|](BRAND_GUIDELINES.md|](brand-guidelines.md|g' \
                -e 's|](DESIGN.md|](design.md|g' \
                -e 's|](PRIVACY.md|](privacy.md|g' \
                -e 's|](SESSION_PERSISTENCE.md|](session-persistence.md|g' \
                -e 's|](CICD.md|](cicd.md|g' \
                "$f" > "site_src/$(basename "$f" | tr '[:upper:]' '[:lower:]')"
          done
          # Rename files with underscores to hyphens for clean URLs
          [ -f site_src/api_setup.md ] && mv site_src/api_setup.md site_src/api-setup.md
          [ -f site_src/lessons_learned.md ] && mv site_src/lessons_learned.md site_src/lessons-learned.md
          [ -f site_src/brand_guidelines.md ] && mv site_src/brand_guidelines.md site_src/brand-guidelines.md
          [ -f site_src/session_persistence.md ] && mv site_src/session_persistence.md site_src/session-persistence.md
          [ -f site_src/error_handling.md ] && mv site_src/error_handling.md site_src/error-handling.md
          [ -f site_src/security_and_compliance.md ] && mv site_src/security_and_compliance.md site_src/security-and-compliance.md
          # Self-host logo and favicon so they load from the same origin
          # (GitHub Pages) instead of raw.githubusercontent.com. This
          # eliminates cross-origin DNS + TLS round-trips on every cold load.
          mkdir -p site_src/img
          cp assets/logo-final-transparent.svg site_src/img/logo.svg
          cp assets/favicon.ico               site_src/img/favicon.ico
          # Publish pre-rendered decks as static assets (served verbatim, not
          # built as mkdocs pages). The rendered HTML/PDF are self-contained
          # (logo inlined as a data URI), so no asset rewriting is needed.
          mkdir -p site_src/decks/compliance
          cp decks/compliance/compliance-deck.html site_src/decks/compliance/index.html
          cp decks/compliance/compliance-deck.pdf  site_src/decks/compliance/compliance-deck.pdf

      - name: Build docs site into publish/docs
        run: mkdocs build -d publish/docs

      - name: Assemble landing page at publish root
        run: |
          mkdir -p publish
          cp landing/index.html publish/index.html
          cp landing/styles.css publish/styles.css
          cp landing/hero-poster.jpg publish/hero-poster.jpg
          cp -R landing/assets publish/assets

      - name: Generate redirect stubs for relocated doc pages
        run: |
          # These slugs were published at the site root before docs moved under /docs/.
          # Each stub 302s (via meta refresh) old inbound links/bookmarks to the new path
          # so external backlinks and search rankings aren't silently broken.
          slugs="examples tools api-setup providers deployment security security-and-compliance architecture contributing error-handling privacy brand-guidelines design lessons-learned session-persistence migration cicd"
          for slug in $slugs; do
            mkdir -p "publish/$slug"
            target="/web-researcher-mcp/docs/$slug/"
            {
              printf '<!DOCTYPE html>\n<html lang="en">\n<head>\n'
              printf '<meta charset="UTF-8">\n'
              printf '<meta http-equiv="refresh" content="0; url=%s">\n' "$target"
              printf '<link rel="canonical" href="https://zoharbabin.com%s">\n' "$target"
              printf '<title>Redirecting...</title>\n</head>\n<body>\n'
              printf '<p>This page moved to <a href="%s">%s</a>.</p>\n' "$target" "$target"
              printf '</body>\n</html>\n'
            } > "publish/$slug/index.html"
          done

      - name: Generate robots.txt
        run: |
          printf 'User-agent: *\nAllow: /\n\nSitemap: https://zoharbabin.com/web-researcher-mcp/docs/sitemap.xml\n' > publish/robots.txt

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: publish
          publish_branch: gh-pages
          force_orphan: true
