# Same standalone Redis Deployment+Service as deploy/k8s-local/02-redis.yaml
# (not a sidecar container — it runs as its own pod, shared by all app
# replicas via the Service below), giving the CI job a real cross-pod session
# backend without any external dependency — kind clusters have no persistent
# volume story and don't need one here: sessions are ephemeral for the
# lifetime of a single CI job.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: web-researcher
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        args: ["--save", "", "--appendonly", "no"]
        ports:
        - containerPort: 6379
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
        readinessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 2
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: web-researcher
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
