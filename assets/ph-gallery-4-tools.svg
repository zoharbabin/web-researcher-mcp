<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1270 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- PH Gallery Image 4: 37 tools, organized by outcome, not by name. -->
  <rect width="1270" height="760" fill="#0F172A"/>

  <!-- Header -->
  <text x="635" y="72"
        font-family="'Inter', 'SF Pro Display', sans-serif"
        font-size="34" font-weight="700" fill="#FFFFFF" letter-spacing="-1"
        text-anchor="middle" text-rendering="optimizeLegibility">37 tools. One question at a time.</text>

  <text x="635" y="104"
        font-family="'Inter', 'SF Pro Display', sans-serif"
        font-size="18" font-weight="400" fill="#64748B"
        text-anchor="middle" text-rendering="optimizeLegibility">Your AI picks the right one automatically. Here's what you actually get out of it.</text>

  <!-- Outcome grid: 2 rows x 4 columns -->
  <!-- Row 1 -->
  <g transform="translate(90, 150)">
    <rect width="255" height="210" rx="16" fill="#1E293B" stroke="url(#gAcc)" stroke-width="1.5"/>
    <text x="128" y="48" font-family="'Inter', sans-serif" font-size="28" text-anchor="middle" fill="#22F0E8">✓</text>
    <text x="128" y="80" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#E2E8F0" text-anchor="middle">Catch a fake citation</text>
    <text x="128" y="108" font-family="'Inter', sans-serif" font-size="13" fill="#94A3B8" text-anchor="middle">before it ships</text>
    <text x="128" y="140" font-family="'Inter', sans-serif" font-size="12" fill="#64748B" text-anchor="middle">verify_citation checks a claim</text>
    <text x="128" y="160" font-family="'Inter', sans-serif" font-size="12" fill="#64748B" text-anchor="middle">against the source. audit_</text>
    <text x="128" y="180" font-family="'Inter', sans-serif" font-size="12" fill="#64748B" text-anchor="middle">bibliography sweeps a whole</text>
    <text x="128" y="200" font-family="'Inter', sans-serif" font-size="12" fill="#64748B" text-anchor="middle">reference list for dead DOIs.</text>
  </g>

  <g transform="translate(365, 150)">
    <rect width="255" height="210" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="128" y="48" font-family="'Inter', sans-serif" font-size="28" text-anchor="middle" fill="#22F0E8">⚖️</text>
    <text x="128" y="80" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#E2E8F0" text-anchor="middle">See where models</text>
    <text x="128" y="104" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#E2E8F0" text-anchor="middle">disagree</text>
    <text x="128" y="140" font-family="'Inter', sans-serif" font-size="12" fill="#64748B" text-anchor="middle">research_panel asks the same</text>
    <text x="128" y="160" font-family="'Inter', sans-serif" font-size="12" fill="#64748B" text-anchor="middle">question to multiple LLMs and</text>
    <text x="128" y="180" font-family="'Inter', sans-serif" font-size="12" fill="#64748B" text-anchor="middle">flags contradictions — not</text>
    <text x="128" y="200" font-family="'Inter', sans-serif" font-size="12" fill="#64748B" text-anchor="middle">just one model's confidence.</text>
  </g>

  <g transform="translate(640, 150)">
    <rect width="255" height="210" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="128" y="48" font-family="'Inter', sans-serif" font-size="28" text-anchor="middle" fill="#22F0E8">📡</text>
    <text x="128" y="80" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#E2E8F0" text-anchor="middle">Track a topic</text>
    <text x="128" y="104" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#E2E8F0" text-anchor="middle">over time</text>
    <text x="128" y="140" font-family="'Inter', sans-serif" font-size="12" fill="#64748B" text-anchor="middle">monitor_query_save watches a</text>
    <text x="128" y="160" font-family="'Inter', sans-serif" font-size="12" fill="#64748B" text-anchor="middle">saved query for new results,</text>
    <text x="128" y="180" font-family="'Inter', sans-serif" font-size="12" fill="#64748B" text-anchor="middle">so you check back instead of</text>
    <text x="128" y="200" font-family="'Inter', sans-serif" font-size="12" fill="#64748B" text-anchor="middle">re-searching from scratch.</text>
  </g>

  <g transform="translate(915, 150)">
    <rect width="255" height="210" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="128" y="48" font-family="'Inter', sans-serif" font-size="28" text-anchor="middle" fill="#22F0E8">🏛️</text>
    <text x="128" y="80" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#E2E8F0" text-anchor="middle">Search filings,</text>
    <text x="128" y="104" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#E2E8F0" text-anchor="middle">case law &amp; trials</text>
    <text x="128" y="140" font-family="'Inter', sans-serif" font-size="12" fill="#64748B" text-anchor="middle">filing_search (SEC EDGAR),</text>
    <text x="128" y="160" font-family="'Inter', sans-serif" font-size="12" fill="#64748B" text-anchor="middle">legal_search (case law),</text>
    <text x="128" y="180" font-family="'Inter', sans-serif" font-size="12" fill="#64748B" text-anchor="middle">clinical_search (trials),</text>
    <text x="128" y="200" font-family="'Inter', sans-serif" font-size="12" fill="#64748B" text-anchor="middle">econ_search (FRED, OECD).</text>
  </g>

  <!-- Row 2 -->
  <g transform="translate(90, 390)">
    <rect width="255" height="210" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="128" y="48" font-family="'Inter', sans-serif" font-size="28" text-anchor="middle" fill="#22F0E8">🎓</text>
    <text x="128" y="80" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#E2E8F0" text-anchor="middle">Pull real papers,</text>
    <text x="128" y="104" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#E2E8F0" text-anchor="middle">not made-up ones</text>
    <text x="128" y="140" font-family="'Inter', sans-serif" font-size="12" fill="#64748B" text-anchor="middle">academic_search across arXiv,</text>
    <text x="128" y="160" font-family="'Inter', sans-serif" font-size="12" fill="#64748B" text-anchor="middle">PubMed, OpenAlex, CrossRef.</text>
    <text x="128" y="180" font-family="'Inter', sans-serif" font-size="12" fill="#64748B" text-anchor="middle">paper_fulltext reads the</text>
    <text x="128" y="200" font-family="'Inter', sans-serif" font-size="12" fill="#64748B" text-anchor="middle">actual PDF, not an abstract.</text>
  </g>

  <g transform="translate(365, 390)">
    <rect width="255" height="210" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="128" y="48" font-family="'Inter', sans-serif" font-size="28" text-anchor="middle" fill="#22F0E8">🔬</text>
    <text x="128" y="80" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#E2E8F0" text-anchor="middle">Run a multi-step</text>
    <text x="128" y="104" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#E2E8F0" text-anchor="middle">investigation</text>
    <text x="128" y="140" font-family="'Inter', sans-serif" font-size="12" fill="#64748B" text-anchor="middle">sequential_search keeps state</text>
    <text x="128" y="160" font-family="'Inter', sans-serif" font-size="12" fill="#64748B" text-anchor="middle">across steps and flags gaps.</text>
    <text x="128" y="180" font-family="'Inter', sans-serif" font-size="12" fill="#64748B" text-anchor="middle">company_recon builds a full</text>
    <text x="128" y="200" font-family="'Inter', sans-serif" font-size="12" fill="#64748B" text-anchor="middle">profile from public sources.</text>
  </g>

  <g transform="translate(640, 390)">
    <rect width="255" height="210" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="128" y="48" font-family="'Inter', sans-serif" font-size="28" text-anchor="middle" fill="#22F0E8">📄</text>
    <text x="128" y="80" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#E2E8F0" text-anchor="middle">Read the whole</text>
    <text x="128" y="104" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#E2E8F0" text-anchor="middle">page, not a snippet</text>
    <text x="128" y="140" font-family="'Inter', sans-serif" font-size="12" fill="#64748B" text-anchor="middle">scrape_page and search_and_</text>
    <text x="128" y="160" font-family="'Inter', sans-serif" font-size="12" fill="#64748B" text-anchor="middle">scrape extract full text from</text>
    <text x="128" y="180" font-family="'Inter', sans-serif" font-size="12" fill="#64748B" text-anchor="middle">PDFs, DOCX, YouTube, and</text>
    <text x="128" y="200" font-family="'Inter', sans-serif" font-size="12" fill="#64748B" text-anchor="middle">JS-rendered pages.</text>
  </g>

  <g transform="translate(915, 390)">
    <rect width="255" height="210" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="128" y="48" font-family="'Inter', sans-serif" font-size="28" text-anchor="middle" fill="#22F0E8">📚</text>
    <text x="128" y="80" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#E2E8F0" text-anchor="middle">Export a bibliography,</text>
    <text x="128" y="104" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#E2E8F0" text-anchor="middle">not a link dump</text>
    <text x="128" y="140" font-family="'Inter', sans-serif" font-size="12" fill="#64748B" text-anchor="middle">format_bibliography exports</text>
    <text x="128" y="160" font-family="'Inter', sans-serif" font-size="12" fill="#64748B" text-anchor="middle">APA/MLA/BibTeX/RIS. archive_</text>
    <text x="128" y="180" font-family="'Inter', sans-serif" font-size="12" fill="#64748B" text-anchor="middle">source snapshots a page so</text>
    <text x="128" y="200" font-family="'Inter', sans-serif" font-size="12" fill="#64748B" text-anchor="middle">the citation survives a 404.</text>
  </g>

  <!-- Bottom -->
  <text x="635" y="655"
        font-family="'Inter', sans-serif" font-size="17" fill="#475569"
        text-anchor="middle" text-rendering="optimizeLegibility">No tool names to memorize. Just ask your question — your AI figures out which tool fits.</text>

  <text x="635" y="695"
        font-family="'Inter', sans-serif" font-size="15" fill="#64748B"
        text-anchor="middle">github.com/zoharbabin/web-researcher-mcp</text>

  <defs>
    <linearGradient id="gAcc" x1="90" y1="150" x2="345" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22F0E8"/>
      <stop offset="100%" stop-color="#5B4CFF"/>
    </linearGradient>
  </defs>
</svg>
