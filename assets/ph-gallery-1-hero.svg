<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1270 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- PH Gallery Image 1: Hero — Logo + tagline on light canvas -->
  <rect width="1270" height="760" fill="#FFFFFF"/>

  <defs>
    <linearGradient id="g1" x1="400" y1="100" x2="870" y2="660" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0EA5C9"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>

  <!-- Logo mark on its dark tile, centered -->
  <g transform="translate(505, 130)">
    <rect width="260" height="260" rx="48" fill="#0F172A"/>
    <g transform="translate(130, 130) scale(0.44)">
      <path d="M256 84 L388 160 L388 312 L256 388 L124 312 L124 160 Z"
            stroke="url(#g1)" stroke-width="40" stroke-linejoin="round" stroke-linecap="round" fill="none"
            transform="translate(-256, -236)"/>
      <path d="M242 384 Q256 448 270 384"
            stroke="url(#g1)" stroke-width="28" stroke-linecap="round" fill="none"
            transform="translate(-256, -236)"/>
      <circle cx="0" cy="-4" r="28" fill="#E0F8F5"/>
    </g>
  </g>

  <!-- Project name -->
  <text x="635" y="470"
        font-family="'Inter', 'SF Pro Display', sans-serif"
        font-size="48" font-weight="700" fill="#0F172A" letter-spacing="-2"
        text-anchor="middle" text-rendering="optimizeLegibility">web-researcher-mcp</text>

  <!-- Tagline -->
  <text x="635" y="516"
        font-family="'Inter', 'SF Pro Display', sans-serif"
        font-size="24" font-weight="400" fill="#475569" letter-spacing="-0.3"
        text-anchor="middle" text-rendering="optimizeLegibility">Your AI research assistant that cites real sources and stays honest</text>

  <!-- Stats row -->
  <g font-family="'Inter', 'SF Pro Display', sans-serif" text-rendering="optimizeLegibility">
    <rect x="215" y="570" width="200" height="90" rx="16" fill="#EFF6FF"/>
    <text x="315" y="613" font-size="30" font-weight="700" fill="#2563EB" text-anchor="middle">37</text>
    <text x="315" y="640" font-size="14" font-weight="500" fill="#475569" text-anchor="middle">Research Tools</text>

    <rect x="435" y="570" width="200" height="90" rx="16" fill="#F5F3FF"/>
    <text x="535" y="613" font-size="30" font-weight="700" fill="#7C3AED" text-anchor="middle">30+</text>
    <text x="535" y="640" font-size="14" font-weight="500" fill="#475569" text-anchor="middle">Search Providers</text>

    <rect x="655" y="570" width="200" height="90" rx="16" fill="#FFFBEB"/>
    <text x="755" y="613" font-size="30" font-weight="700" fill="#D97706" text-anchor="middle">20</text>
    <text x="755" y="640" font-size="14" font-weight="500" fill="#475569" text-anchor="middle">Search Lenses</text>

    <rect x="875" y="570" width="200" height="90" rx="16" fill="#F0FDF4"/>
    <text x="975" y="613" font-size="30" font-weight="700" fill="#16A34A" text-anchor="middle">Private</text>
    <text x="975" y="640" font-size="14" font-weight="500" fill="#475569" text-anchor="middle">Runs on Your Machine</text>
  </g>
</svg>
