<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1270 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- PH Gallery Image 2: Install in 10 seconds — light canvas, terminal keeps native dark chrome -->
  <rect width="1270" height="760" fill="#FFFFFF"/>

  <!-- Header -->
  <text x="635" y="60"
        font-family="'Inter', 'SF Pro Display', sans-serif"
        font-size="32" font-weight="700" fill="#0F172A" letter-spacing="-1"
        text-anchor="middle" text-rendering="optimizeLegibility">Install in 10 seconds. Works immediately.</text>

  <!-- Terminal window -->
  <rect x="100" y="100" width="1070" height="520" rx="12" fill="#0F172A"/>
  <!-- Terminal title bar -->
  <rect x="100" y="100" width="1070" height="36" rx="12" fill="#1E293B"/>
  <circle cx="128" cy="118" r="6" fill="#EF4444"/>
  <circle cx="148" cy="118" r="6" fill="#F59E0B"/>
  <circle cx="168" cy="118" r="6" fill="#22C55E"/>
  <text x="635" y="123" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94A3B8" text-anchor="middle">Terminal</text>

  <!-- Terminal content -->
  <g font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="16" fill="#E2E8F0">
    <text x="130" y="170" fill="#06B6D4">$</text>
    <text x="150" y="170">go install github.com/zoharbabin/web-researcher-mcp/cmd/web-researcher-mcp@latest</text>

    <text x="130" y="210" fill="#64748B"># Add to your Claude Code MCP config:</text>

    <text x="130" y="250" fill="#06B6D4">$</text>
    <text x="150" y="250">cat ~/.claude/mcp_servers.json</text>

    <text x="130" y="290" fill="#A78BFA">{</text>
    <text x="150" y="320" fill="#94A3B8">"web-researcher"</text><text x="320" y="320" fill="#E2E8F0">: {</text>
    <text x="170" y="350" fill="#94A3B8">"command"</text><text x="280" y="350" fill="#E2E8F0">: </text><text x="300" y="350" fill="#86EFAC">"web-researcher-mcp"</text><text x="510" y="350" fill="#E2E8F0">,</text>
    <text x="170" y="380" fill="#94A3B8">"env"</text><text x="230" y="380" fill="#E2E8F0">: {</text>
    <text x="190" y="410" fill="#94A3B8">"GOOGLE_CUSTOM_SEARCH_API_KEY"</text><text x="540" y="410" fill="#E2E8F0">: </text><text x="560" y="410" fill="#86EFAC">"your-key"</text><text x="665" y="410" fill="#E2E8F0">,</text>
    <text x="190" y="440" fill="#94A3B8">"GOOGLE_CUSTOM_SEARCH_ID"</text><text x="490" y="440" fill="#E2E8F0">: </text><text x="510" y="440" fill="#86EFAC">"your-cx"</text>
    <text x="170" y="470" fill="#E2E8F0">}</text>
    <text x="150" y="500" fill="#E2E8F0">}</text>
    <text x="130" y="530" fill="#A78BFA">}</text>

    <text x="130" y="580" fill="#06B6D4">$</text>
    <text x="150" y="580">claude</text>
    <text x="220" y="580" fill="#64748B"># That's it. Your AI can now research the web.</text>
  </g>

  <!-- Bottom caption -->
  <text x="635" y="680"
        font-family="'Inter', 'SF Pro Display', sans-serif"
        font-size="18" font-weight="400" fill="#64748B"
        text-anchor="middle" text-rendering="optimizeLegibility">Single static binary. Zero dependencies. Works with Claude, Cursor, and any MCP client.</text>
</svg>
