<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1270 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- PH Gallery Image 2: Install in 10 seconds — light canvas, terminal keeps native dark chrome -->
  <rect width="1270" height="760" fill="#FFFFFF"/>

  <!-- Header -->
  <text x="635" y="60"
        font-family="'Inter', 'SF Pro Display', sans-serif"
        font-size="32" font-weight="700" fill="#0F172A" letter-spacing="-1"
        text-anchor="middle" text-rendering="optimizeLegibility">Install in 10 seconds. Works immediately.</text>

  <!-- Terminal window -->
  <rect x="100" y="100" width="1070" height="520" rx="12" fill="#0F172A"/>
  <!-- Terminal title bar -->
  <rect x="100" y="100" width="1070" height="36" rx="12" fill="#1E293B"/>
  <circle cx="128" cy="118" r="6" fill="#EF4444"/>
  <circle cx="148" cy="118" r="6" fill="#F59E0B"/>
  <circle cx="168" cy="118" r="6" fill="#22C55E"/>
  <text x="635" y="123" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94A3B8" text-anchor="middle">Terminal</text>

  <!-- Terminal content -->
  <g font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="16" fill="#E2E8F0">
    <text x="130" y="180" fill="#64748B"># One line. Works now. DuckDuckGo needs no API key.</text>
    <text x="130" y="215" fill="#06B6D4">$</text>
    <text x="150" y="215">claude mcp add --scope user web-researcher -- uvx web-researcher-mcp</text>

    <text x="130" y="290" fill="#64748B"># Optional: add a Brave key for richer results.</text>
    <text x="130" y="325" fill="#06B6D4">$</text>
    <text x="150" y="325">claude mcp add --scope user web-researcher \</text>
    <text x="190" y="355">-e SEARCH_PROVIDER=brave -e BRAVE_API_KEY=<tspan fill="#86EFAC">your-key</tspan> \</text>
    <text x="190" y="385">-- uvx web-researcher-mcp</text>

    <text x="130" y="460" fill="#06B6D4">$</text>
    <text x="150" y="460">claude</text>
    <text x="220" y="460" fill="#64748B"># Your AI can now search, read pages and verify citations.</text>
  </g>

  <!-- Bottom caption -->
  <text x="635" y="680"
        font-family="'Inter', 'SF Pro Display', sans-serif"
        font-size="18" font-weight="400" fill="#64748B"
        text-anchor="middle" text-rendering="optimizeLegibility">Needs uv. No API key to start. Works with Claude, Cursor, and any MCP client.</text>
</svg>
